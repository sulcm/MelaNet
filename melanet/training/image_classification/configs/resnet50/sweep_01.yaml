name: Sweep-ResNet50-CE
method: bayes
metric:
  goal: minimize
  name: eval_loss
parameters:
  # Model:
  model_name_or_path:
    value: "timm/resnet50.a1_in1k"
  ignore_mismatched_sizes:
    value: True
  fp16:
    value: True
  # Dataset:
  dataset_name:
    value: "/home/sulcm/datasets/milk10k/SpilledMILK10k"
  image_column_name:
    value: "image"
  label_column_name:
    value: "label"
  remove_unused_columns:
    value: False
  # Training:
  classification_task:
    value: "multiclass"
  output_dir:
    value: "/home/sulcm/models/melanet/resnet50/melanet_resnet_test_01"
  overwrite_output_dir:
    value: True
  save_steps:
    value: 5000
  save_total_limit:
    value: 2
  load_best_model_at_end:
    value: True
  logging_strategy:
    value: "steps"
  logging_steps:
    value: 100
  do_train:
    value: True
  do_eval:
    value: True
  report_to:
    value: "wandb"
  dataloader_num_workers:
    value: 4
  seed:
    value: 42
  # Hyperparameters:
  num_train_epochs:
    value: 20
  learning_rate:
    min: 1e-5
    max: 1e-2
    distribution: log_uniform_values
  lr_scheduler_type:
    value: "cosine"
  warmup_ratio:
    value: 0.05
  per_device_train_batch_size:
    values: [32, 64]
  gradient_accumulation_steps:
    value: 1
  per_device_eval_batch_size:
    value: 32
  eval_strategy:
    value: "steps"
  eval_steps:
    value: 1000
  save_strategy:
    value: "steps"